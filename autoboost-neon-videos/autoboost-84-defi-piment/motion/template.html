<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: "AB Sans"; src: url("fonts/Inter-700-latin.woff2") format("woff2"); font-weight: 700; font-display: block; }
@font-face { font-family: "AB Sans"; src: url("fonts/Inter-400-latin.woff2") format("woff2"); font-weight: 400; font-display: block; }
@font-face { font-family: "AB Mono"; src: url("fonts/JetBrainsMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
/* Kit « Piment Power » : orange #FF8A00, jaune #FFD600, violet #A855FF, rouge feu #FF2D00, noir #050305. No emoji. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050305; font-family: "AB Sans", sans-serif; font-weight: 700; color: #fff; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050305; }
#camw { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 640px; }
#camw video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
/* warm grade + heat vignette over the take */
#grade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(255,138,0,0) 45%, rgba(40,6,0,.55) 100%); mix-blend-mode: multiply; }
#heat { position: absolute; left: 0; bottom: 0; width: 1080px; height: 520px; background: linear-gradient(0deg, rgba(255,45,0,.55), rgba(255,138,0,.18) 45%, rgba(0,0,0,0)); mix-blend-mode: screen; opacity: 0; }
.topshade { position: absolute; left: 0; top: 0; width: 1080px; height: 560px; background: linear-gradient(180deg, rgba(5,3,5,.85), rgba(5,3,5,0)); opacity: 0; }
/* hook title */
#hook { position: absolute; left: 0; top: 120px; width: 1080px; text-align: center; }
#hook .k { display: inline-block; font-family: "AB Mono", monospace; font-size: 34px; letter-spacing: .22em; color: #FFD600; padding: 10px 26px; border: 3px solid #FF8A00; border-radius: 40px;
  background: rgba(5,3,5,.75); box-shadow: 0 0 26px rgba(255,138,0,.6); opacity: 0; }
#hook .t { margin-top: 22px; font-size: 150px; line-height: .92; letter-spacing: -0.04em; text-transform: uppercase;
  color: #FFD600; text-shadow: 0 0 30px rgba(255,138,0,.9), 0 6px 0 #FF2D00, 0 12px 40px rgba(255,45,0,.7); }
#hook .t span { display: inline-block; opacity: 0; }
#hook .s { margin-top: 18px; font-size: 54px; color: #fff; text-shadow: 0 0 20px rgba(168,85,255,.9); opacity: 0; }
.fl { position: absolute; opacity: 0; }
#fl1 { left: -40px; bottom: -30px; width: 1160px; }
/* chili meter */
#meter { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 16px 28px; border-radius: 48px;
  background: rgba(5,3,5,.8); border: 3px solid #FF8A00; box-shadow: 0 0 30px rgba(255,138,0,.55); opacity: 0; }
#meter .lab { font-family: "AB Mono", monospace; font-size: 28px; letter-spacing: .14em; color: #FFD600; margin-right: 6px; }
#meter .p { width: 44px; height: 70px; border-radius: 22px 22px 26px 26px / 18px 18px 52px 52px; background: #2a1a12; border: 3px solid #55331f; position: relative; }
#meter .p::before { content: ""; position: absolute; left: 13px; top: -14px; width: 12px; height: 18px; border-radius: 6px; background: #3a5a1f; }
#meter .p.on { background: linear-gradient(180deg, #FF8A00, #FF2D00 60%, #b30d00); border-color: #FFD600; box-shadow: 0 0 22px rgba(255,45,0,.9); }
#meter .lv { font-family: "AB Mono", monospace; font-size: 34px; color: #fff; width: 76px; text-align: right; }
/* stickers from the kit (black matte: screen) */
.st { position: absolute; width: 560px; opacity: 0; filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
/* Tony IA circle */
#iaw { position: absolute; left: 0; top: 0; width: 420px; height: 420px; opacity: 0; }
#iaw .disc { position: absolute; left: 60px; top: 60px; width: 300px; height: 300px; border-radius: 50%; overflow: hidden; background: #120814; box-shadow: 0 0 0 6px #A855FF, 0 0 50px rgba(168,85,255,.8); }
#iaw .disc video { position: absolute; left: -10px; top: -6px; width: 320px; height: 320px; }
#iaw img { position: absolute; left: -10px; top: -14px; width: 440px; height: 460px; }
#iaw .tag { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 8px 18px; border-radius: 24px;
  background: #050305; border: 3px solid #A855FF; font-family: "AB Mono", monospace; font-size: 24px; letter-spacing: .12em; white-space: nowrap; }
#iaw .tag span { background: #A855FF; color: #050305; padding: 2px 8px; border-radius: 6px; }
/* captions */
#cap { position: absolute; left: 0; top: 1400px; width: 1080px; height: 140px; }
.cap { position: absolute; left: 50%; top: 0; transform: translateX(-50%); white-space: nowrap; padding: 22px 38px; border-radius: 28px; font-size: 64px; letter-spacing: -0.02em;
  background: rgba(5,3,5,.82); border: 4px solid #FF8A00; box-shadow: 0 0 34px rgba(255,138,0,.55); text-transform: uppercase; opacity: 0; }
.cap.ia { border-color: #A855FF; box-shadow: 0 0 34px rgba(168,85,255,.7); }
.cap .who { font-family: "AB Mono", monospace; font-size: 30px; background: #A855FF; color: #050305; padding: 4px 10px; border-radius: 8px; margin-right: 14px; vertical-align: 10px; }
.cw { color: #fff; }
/* CTA */
#cta { position: absolute; left: 0; top: 1240px; width: 1080px; display: flex; justify-content: center; gap: 26px; opacity: 0; }
#cta .b { display: flex; align-items: center; gap: 16px; padding: 24px 40px; border-radius: 60px; font-size: 52px; text-transform: uppercase; }
#cta .like { background: #050305; border: 4px solid #FFD600; color: #FFD600; box-shadow: 0 0 30px rgba(255,214,0,.6); }
#cta .sub { background: linear-gradient(180deg, #FF8A00, #FF2D00); color: #fff; box-shadow: 0 0 40px rgba(255,45,0,.8); }
#cta svg { width: 54px; height: 54px; }
#flash { position: absolute; inset: 0; background: #fff3d0; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="autoboost-84" data-start="0" data-width="1080" data-height="1920" data-duration="%%TOTAL%%" data-fps="30">
  <div id="camw"><video id="cam" src="base.mp4" muted playsinline data-start="0" data-media-start="0" data-duration="%%TOTAL%%" data-track-index="1"></video></div>
  <div id="grade"></div>
  <div id="heat"></div>
  <div class="topshade" id="tsh"></div>
  <img class="fl" id="fl1" src="piment/flammes-alpha-experimental.png" alt="" />
  <div id="hook"><div class="k">DÉFI PIMENT</div><div class="t">%%HOOK%%</div><div class="s">nouilles extra-fortes</div></div>
  <div id="meter"><span class="lab">PIMENT</span><i class="p" id="p1"></i><i class="p" id="p2"></i><i class="p" id="p3"></i><i class="p" id="p4"></i><i class="p" id="p5"></i><span class="lv" id="lv">0/5</span></div>
%%OVERLAYS%%
  <div id="iaw"><div class="disc"><video id="iav" src="avatar.mp4" muted playsinline data-start="0" data-media-start="0" data-duration="%%TOTAL%%" data-track-index="2"></video></div><img src="piment/cadre-06.png" alt="" /><div class="tag"><b>TONY</b><span>IA</span></div></div>
  <div id="cta"><div class="b like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11H3V10z"/><path d="M7 10l4-8a3 3 0 0 1 3 3v4h6a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 18.6 21H7"/></svg>LIKE</div><div class="b sub">ABONNE-TOI</div></div>
  <div id="cap">%%CAPTIONS%%</div>
  <div id="flash"></div>
  <script src="vendor/gsap.min.js"></script>
  <script>
  (function () {
    var tl = gsap.timeline({ paused: true });
%%JS%%
    window.__timelines = window.__timelines || {};
    window.__timelines["autoboost-84"] = tl;
  })();
  </script>
</div>
</body>
</html>
