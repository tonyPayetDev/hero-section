<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="kit/kit.css" />
<style>
@font-face { font-family: "AB Sans"; src: url("fonts/Inter-700-latin.woff2") format("woff2"); font-weight: 700; font-display: block; }
@font-face { font-family: "AB Sans"; src: url("fonts/Inter-400-latin.woff2") format("woff2"); font-weight: 400; font-display: block; }
@font-face { font-family: "AB Mono"; src: url("fonts/JetBrainsMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
/* Charte AutomatisationBoost - gold / violet, no green, no emoji. Refs: light card + yellow highlight,
   node graph with electric connectors (gold/violet instead of green), mono caption pill, cutout presenter */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0a10; font-family: "AB Sans", sans-serif; font-weight: 700; color: #EDEDED; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0a10; }
/* studio backdrop: dark room, blurred neon tubes, bokeh */
.bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 70%, #1a1622 0%, #0b0a10 62%); }
.tube { position: absolute; width: 26px; border-radius: 13px; filter: blur(6px); }
#tb1 { left: 46px; top: 860px; height: 300px; background: #eab308; box-shadow: 0 0 60px 20px rgba(234,179,8,.55); }
#tb2 { left: 46px; top: 1190px; height: 150px; background: #eab308; box-shadow: 0 0 60px 20px rgba(234,179,8,.45); }
#tb3 { left: 1010px; top: 960px; height: 360px; background: #8b5cf6; box-shadow: 0 0 60px 20px rgba(139,92,246,.6); }
.bokeh { position: absolute; border-radius: 50%; filter: blur(14px); }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 60px 60px;
  -webkit-mask: linear-gradient(180deg, #000 0%, #000 40%, transparent 70%); mask: linear-gradient(180deg, #000 0%, #000 40%, transparent 70%); }
/* the presenter cutout (wrapper is animated, never the timed video) */
#tony { position: absolute; left: 0; top: 0; width: 1080px; height: 1440px; z-index: 6; transform-origin: 540px 900px; }
#tony video { position: absolute; left: 0; top: 0; width: 1080px; height: 1440px; }
#tonyglow { position: absolute; left: 140px; top: 760px; width: 800px; height: 800px; border-radius: 50%; z-index: 5;
  background: radial-gradient(circle, rgba(139,92,246,.22), rgba(234,179,8,.08) 45%, transparent 68%); }
/* top zone */
.scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 4; }
.front { z-index: 8; }
.lcard { position: absolute; left: 46px; top: 110px; width: 988px; border-radius: 40px; background: #F4F2EE; color: #0a0a0f; padding: 44px 54px 46px;
  box-shadow: 0 0 0 4px rgba(234,179,8,.95), 0 0 0 9px rgba(139,92,246,.75), 0 0 70px rgba(139,92,246,.55), 0 0 40px rgba(234,179,8,.35); opacity: 0; }
.lbar { display: flex; align-items: center; gap: 12px; font-size: 20px; letter-spacing: .34em; color: #3a3a48; font-weight: 400; }
.lbar b { color: #eab308; font-weight: 700; } .lbar span { margin-right: auto; }
.lbar i { width: 18px; height: 18px; border-radius: 50%; display: block; } .lbar .d1 { background: #ff6b6b; } .lbar .d2 { background: #eab308; } .lbar .d3 { background: #8b5cf6; }
.t1 { font-size: 92px; line-height: 1.04; letter-spacing: -0.045em; margin-top: 26px; }
.hl { display: inline-block; padding: 0 14px; margin-left: -14px; background: linear-gradient(#facc15, #facc15) no-repeat 0 0 / 0% 100%; border-radius: 6px; }
.hl.v { background-image: linear-gradient(#a78bfa, #a78bfa); }
.white { color: #EDEDED; }
.chain { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 36px; }
.app { width: 190px; text-align: center; opacity: 0; }
.app .tile { width: 132px; height: 116px; margin: 0 auto 12px; border-radius: 26px; background: #fff; display: flex; align-items: center; justify-content: center;
  color: #7c3aed; box-shadow: 0 8px 24px rgba(0,0,0,.10); position: relative; }
.app .tile.gold { color: #b7791f; } .app .tile.red { color: #e5484d; }
.app b { display: block; font-size: 27px; } .app small { display: block; font-size: 20px; color: #8A8A8A; font-weight: 400; }
.app .cnt { position: absolute; right: -14px; top: -14px; width: 46px; height: 46px; border-radius: 50%; background: #ff6b6b; color: #fff; font-size: 22px;
  display: flex; align-items: center; justify-content: center; }
.arr { width: 56px; margin-top: 52px; height: 4px; transform-origin: 0 50%; transform: scaleX(0);
  background: repeating-linear-gradient(90deg, #8b5cf6 0 8px, transparent 8px 14px); position: relative; }
.arr::after { content: ""; position: absolute; right: -4px; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: #eab308; box-shadow: 0 0 10px #eab308; }
/* headline without card (refs 4/5) */
.head { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 104px; line-height: 1.0; letter-spacing: -0.05em; }
.chip { display: inline-flex; padding: 14px 36px; border-radius: 16px; border: 3px solid; font-family: "AB Mono", monospace; font-size: 28px; letter-spacing: .2em;
  border-image: linear-gradient(90deg, #8b5cf6, #eab308) 1; background: rgba(10,10,15,.85); opacity: 0; }
.chip b { color: #eab308; margin-left: .5em; }
.char { display: inline-block; opacity: 0; } .char.sp { width: .24em; }
/* video tiles (hook) */
.vt { position: absolute; top: 470px; width: 150px; height: 266px; border-radius: 24px; background: #15131f; border: 3px solid #3a3350; opacity: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #a78bfa; }
.vt b { font-family: "AB Mono", monospace; font-size: 22px; color: #EDEDED; }
/* node graph (ref 1, gold/violet) */
.graph { position: absolute; left: 30px; top: 100px; width: 1020px; height: 600px; border-radius: 34px; background: rgba(14,13,20,.92);
  border: 2px solid rgba(139,92,246,.45); box-shadow: 0 0 50px rgba(139,92,246,.25); opacity: 0; overflow: hidden; }
.graph .gg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px; }
.node { position: absolute; width: 250px; height: 190px; border-radius: 26px; background: #1a1824; border: 2px solid #34304a; opacity: .35;
  display: flex; flex-direction: column; justify-content: center; padding: 0 26px; gap: 6px; }
.node .ic { display: flex; width: 64px; height: 64px; border-radius: 18px; align-items: center; justify-content: center; background: #262236; color: #8A8A8A; margin-bottom: 6px; }
.node b { font-size: 32px; color: #EDEDED; letter-spacing: -0.02em; } .node small { font-size: 19px; color: #8A8A8A; font-weight: 400; }
.node .bz { position: absolute; right: -14px; top: -14px; width: 44px; height: 44px; border-radius: 50%; background: #eab308; color: #0a0a0f; display: flex;
  align-items: center; justify-content: center; box-shadow: 0 0 18px #eab308; opacity: 0; }
.wsvg { position: absolute; left: 0; top: 0; overflow: visible; }
.wsvg path { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1400; stroke-dashoffset: 1400; }
.wsvg circle { opacity: 0; }
.gtitle { position: absolute; left: 50px; top: 34px; font-size: 44px; letter-spacing: -0.03em; }
.gtitle em { font-style: normal; color: #eab308; }
/* moi / la machine */
.duo { display: flex; gap: 24px; margin-top: 34px; }
.side { flex: 1; border-radius: 26px; padding: 26px 28px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.08); opacity: 0; }
.side small { display: block; font-family: "AB Mono", monospace; font-size: 20px; letter-spacing: .14em; color: #7c3aed; }
.side.m small { color: #b7791f; }
.side b { display: flex; align-items: center; gap: 14px; font-size: 44px; letter-spacing: -0.03em; margin-top: 10px; }
.side b i { display: flex; color: #7c3aed; } .side.m b i { color: #b7791f; }
/* entreprises card behind the head (ref 4) */
.dash { position: absolute; left: 66px; top: 420px; width: 948px; height: 470px; border-radius: 34px; background: #F4F2EE; color: #0a0a0f; padding: 34px 40px; opacity: 0;
  box-shadow: 0 0 0 4px rgba(234,179,8,.9), 0 0 0 9px rgba(139,92,246,.7), 0 0 60px rgba(139,92,246,.5); }
.dash h4 { font-size: 40px; letter-spacing: -0.03em; } .dash p { font-size: 22px; color: #6b6b78; font-weight: 400; margin-top: 4px; }
.dash .live { position: absolute; right: 40px; top: 42px; font-size: 22px; color: #3a3a48; font-weight: 400; display: flex; align-items: center; gap: 10px; }
.dash .live i { width: 14px; height: 14px; border-radius: 50%; background: #eab308; box-shadow: 0 0 10px #eab308; }
.cos { display: flex; gap: 20px; margin-top: 30px; }
.co { flex: 1; height: 150px; border-radius: 22px; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.08); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; color: #7c3aed; opacity: 0; position: relative; }
.co b { font-size: 22px; color: #0a0a0f; } .co .ok { position: absolute; right: 12px; top: 12px; width: 34px; height: 34px; border-radius: 50%; background: #eab308; color: #0a0a0f;
  display: flex; align-items: center; justify-content: center; opacity: 0; }
/* CTA */
.ctaw { position: absolute; left: 0; top: 150px; width: 1080px; text-align: center; }
.ctaw .a { font-size: 96px; letter-spacing: -0.04em; } .ctaw .b { font-size: 250px; letter-spacing: -0.06em; line-height: 1; color: #eab308; text-shadow: 0 0 50px rgba(234,179,8,.6); }
.cfield { position: absolute; left: 90px; top: 540px; width: 900px; height: 110px; border-radius: 55px; border: 3px solid #8b5cf6; background: rgba(17,17,23,.95);
  display: flex; align-items: center; gap: 22px; padding: 0 36px; box-shadow: 0 0 34px rgba(139,92,246,.5); opacity: 0; }
.cfield .pre { font-size: 32px; color: #8A8A8A; font-weight: 400; } .cfield .kw { font-family: "AB Mono", monospace; font-size: 56px; color: #eab308; letter-spacing: .1em; flex: 1; }
.cfield .snd { display: flex; color: #eab308; opacity: 0; }
/* caption pill (refs 2/3) */
#cap { position: absolute; left: 0; top: 0; z-index: 9; height: 96px; border-radius: 22px; background: rgba(10,10,15,.92); border: 3px solid #8b5cf6;
  box-shadow: 0 0 26px rgba(139,92,246,.6), inset 0 0 18px rgba(139,92,246,.25); }
.cap { position: absolute; left: 0; top: 0; height: 90px; display: flex; align-items: center; gap: 0 26px; padding: 0 44px; font-family: "AB Mono", monospace;
  font-size: 44px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; opacity: 0; }
.cw { display: inline-block; color: #EDEDED; }
#flash { position: absolute; inset: 0; z-index: 30; opacity: 0; background: #fff3b0; pointer-events: none; }
.fb-sticker { z-index: 12; }
</style>
</head>
<body>
<div id="root" data-composition-id="autoboost-79" data-start="0" data-width="1080" data-height="1920" data-duration="%%TOTAL%%" data-fps="30">
  <div class="bg"></div>
  <div class="grid"></div>
  <i class="tube" id="tb1"></i><i class="tube" id="tb2"></i><i class="tube" id="tb3"></i>
  <i class="bokeh" style="left:150px;top:1500px;width:60px;height:60px;background:rgba(234,179,8,.35)"></i>
  <i class="bokeh" style="left:900px;top:1600px;width:80px;height:80px;background:rgba(139,92,246,.35)"></i>
  <i class="bokeh" style="left:820px;top:880px;width:40px;height:40px;background:rgba(234,179,8,.3)"></i>
  <div id="tonyglow"></div>
%%SCENES%%
  <div id="tony"><video id="tonyv" src="avatar.webm" muted playsinline data-start="0" data-media-start="0" data-duration="%%TOTAL%%" data-track-index="6"></video></div>
%%FRONT%%
  <div id="cap">%%CAPTIONS%%</div>
%%OVERLAYS%%
  <div id="flash"></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="kit/kit.js"></script>
  <script>
  (function () {
    var tl = gsap.timeline({ paused: true });
%%JS%%
    window.__timelines = window.__timelines || {};
    window.__timelines["autoboost-79"] = tl;
  })();
  </script>
</div>
</body>
</html>
