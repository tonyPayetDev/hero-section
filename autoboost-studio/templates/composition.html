<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="kit/kit.css" />
<style>
/* AutoBoost Studio - « boost niveau » style. Charte: gold #eab308 / violet #8b5cf6 on ink, no green, no emoji.
   Inter (the kit's "AB Sans" slot) + JetBrains Mono. */
@font-face { font-family: "AB Sans"; src: url("fonts/Inter-700-latin.woff2") format("woff2"); font-weight: 700; font-display: block; }
@font-face { font-family: "AB Sans"; src: url("fonts/Inter-400-latin.woff2") format("woff2"); font-weight: 400; font-display: block; }
@font-face { font-family: "AB Mono"; src: url("fonts/JetBrainsMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: %%W%%px; height: %%H%%px; overflow: hidden; background: #0b0a10; font-family: "AB Sans", sans-serif; font-weight: 700; color: #EDEDED; }
#root { position: relative; width: %%W%%px; height: %%H%%px; overflow: hidden; background: #0b0a10; }
.bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 70%, #1a1622 0%, #0b0a10 62%); }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 60px 60px; }
.tube { position: absolute; width: 10px; border-radius: 5px; z-index: 3; }
.tall .tube.l { left: 40px; top: 860px; height: 480px; background: #eab308; box-shadow: 0 0 30px 6px rgba(234,179,8,.6); filter: blur(2px); }
.tall .tube.r { left: 1030px; top: 960px; height: 420px; background: #8b5cf6; box-shadow: 0 0 30px 6px rgba(139,92,246,.6); filter: blur(2px); }
.wide .tube.l { left: 52px; top: 110px; height: 860px; background: #eab308; box-shadow: 0 0 18px #eab308, 0 0 46px rgba(234,179,8,.6); }
.wide .tube.r { left: 1860px; top: 110px; height: 860px; background: #8b5cf6; box-shadow: 0 0 18px #8b5cf6, 0 0 46px rgba(139,92,246,.6); }
#brand { position: absolute; left: 0; top: 46px; width: 100%; text-align: center; font-size: 22px; letter-spacing: .32em; color: #EDEDED; z-index: 4; }
#brand b { color: #eab308; }
.lvl { position: absolute; left: 60px; top: 38px; z-index: 9; display: flex; align-items: center; gap: 14px; padding: 9px 18px; border-radius: 12px;
  background: rgba(10,10,15,.92); border: 2px solid rgba(234,179,8,.85); box-shadow: 0 0 22px rgba(234,179,8,.35); font-size: 22px; letter-spacing: .08em; opacity: 0; }
.wide .lvl { left: 110px; top: 44px; }
.lvl .seg { display: flex; gap: 5px; } .lvl .seg i { display: block; width: 26px; height: 9px; border-radius: 3px; background: #2a2540; }
.lvl .seg i.on { background: #8b5cf6; box-shadow: 0 0 10px #8b5cf6; } .lvl.max .seg i.on { background: #eab308; box-shadow: 0 0 10px #eab308; }
/* camera */
#cam { position: absolute; left: 0; top: 0; width: %%CAMW%%px; height: %%CAMH%%px; z-index: 6; transform-origin: 0px 0px; }
.rect #cam { object-fit: cover; clip-path: inset(0px 0px 0px 0px round 0px); }
#camw { position: absolute; left: 0; top: 0; width: %%CAMW%%px; height: %%CAMH%%px; z-index: 6; transform-origin: 0px 0px; }
#camw video { position: absolute; left: 0; top: 0; width: %%CAMW%%px; height: %%CAMH%%px; }
#camframe { position: absolute; z-index: 7; opacity: 0; pointer-events: none; }
.tall #camframe { left: 24px; top: 790px; width: 1032px; height: 1106px; border-radius: 34px; border: 3px solid rgba(234,179,8,.85);
  box-shadow: 0 0 30px rgba(234,179,8,.45), inset 0 0 40px rgba(139,92,246,.35); }
.wide #camframe { left: 1275px; top: 205px; width: 500px; height: 500px; border-radius: 50%; border: 7px solid #eab308;
  box-shadow: 0 0 26px rgba(234,179,8,.9), 0 0 70px rgba(234,179,8,.35), inset 0 0 26px rgba(139,92,246,.45); }
/* content zone */
.scene { position: absolute; left: 0; top: 0; width: %%W%%px; height: %%H%%px; z-index: 5; }
.cutout .scene, .rect .scene { z-index: 5; }
.in { position: absolute; }
.scene.front { z-index: 8; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,15,.9) 0%, rgba(10,10,15,.55) 30%, transparent 55%); }
.wide .shade { background: linear-gradient(90deg, rgba(10,10,15,.9) 0%, rgba(10,10,15,.55) 45%, transparent 65%); }
.lcard { position: relative; width: 100%; border-radius: 40px; background: #F4F2EE; color: #0a0a0f; padding: 40px 50px 44px; opacity: 0;
  box-shadow: 0 0 0 4px rgba(234,179,8,.95), 0 0 0 9px rgba(139,92,246,.75), 0 0 70px rgba(139,92,246,.55), 0 0 40px rgba(234,179,8,.35); }
.lbar { display: flex; align-items: center; gap: 12px; font-size: 19px; letter-spacing: .34em; color: #3a3a48; font-weight: 400; }
.lbar b { color: #eab308; font-weight: 700; } .lbar span { margin-right: auto; }
.lbar i { width: 18px; height: 18px; border-radius: 50%; display: block; } .lbar .d1 { background: #ff6b6b; } .lbar .d2 { background: #eab308; } .lbar .d3 { background: #8b5cf6; }
.t1 { font-size: 76px; line-height: 1.06; letter-spacing: -0.045em; margin-top: 24px; }
.t2 { font-size: 46px; line-height: 1.1; letter-spacing: -0.03em; margin-top: 14px; }
.hl { display: inline-block; padding: 0 14px; margin-left: -14px; background: linear-gradient(#facc15, #facc15) no-repeat 0 0 / 0% 100%; border-radius: 6px; }
.char { display: inline-block; opacity: 0; } .char.sp { width: .24em; }
.dhead { text-align: center; font-size: 100px; line-height: 1.05; letter-spacing: -0.05em; padding-top: 30px; }
.wide .dhead { text-align: left; }
.dhead .hl { color: #0a0a0f; margin-top: 12px; }
.chain { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 34px; }
.app { width: 190px; text-align: center; opacity: 0; }
.app .tile { width: 130px; height: 112px; margin: 0 auto 12px; border-radius: 26px; background: #fff; display: flex; align-items: center; justify-content: center;
  color: #7c3aed; font-size: 46px; letter-spacing: -0.04em; box-shadow: 0 8px 24px rgba(0,0,0,.10); }
.app b { display: block; font-size: 26px; }
.arr { width: 56px; margin-top: 52px; height: 4px; transform-origin: 0 50%; transform: scaleX(0); background: repeating-linear-gradient(90deg, #8b5cf6 0 8px, transparent 8px 14px); position: relative; }
.arr::after { content: ""; position: absolute; right: -4px; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: #eab308; box-shadow: 0 0 10px #eab308; }
.stat { display: flex; align-items: baseline; gap: 20px; margin-top: 20px; transform-origin: 0 70%; }
.stat .num { font-size: 190px; line-height: 1; letter-spacing: -0.06em; color: #0a0a0f; }
.stat .unit { font-size: 70px; color: #7c3aed; letter-spacing: -0.03em; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 26px; }
.chip { height: 96px; border-radius: 20px; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.08); display: flex; align-items: center; gap: 16px; padding: 0 22px;
  font-size: 32px; letter-spacing: -0.02em; opacity: 0; }
.chip i { display: flex; width: 50px; height: 50px; border-radius: 14px; align-items: center; justify-content: center; background: #262236; color: #8A8A8A; flex: none; }
.duo { display: flex; gap: 22px; margin-top: 30px; }
.side { position: relative; flex: 1; border-radius: 26px; padding: 26px 28px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.08); opacity: 0; min-height: 190px; }
.side small { display: block; font-family: "AB Mono", monospace; font-size: 20px; letter-spacing: .14em; }
.side b { display: block; font-size: 44px; letter-spacing: -0.03em; margin-top: 12px; line-height: 1.08; }
.side.bad small { color: #e5484d; } .side.good small { color: #b7791f; } .side.good { box-shadow: 0 0 0 3px #eab308, 0 8px 24px rgba(0,0,0,.08); }
.side .x { position: absolute; inset: 0; overflow: visible; } .side .x path { fill: none; stroke: #ff6b6b; stroke-width: 3; stroke-dasharray: 300; stroke-dashoffset: 300; vector-effect: non-scaling-stroke; }
.stepn { display: inline-flex; align-items: center; gap: 16px; margin-top: 22px; padding: 10px 24px; border-radius: 16px; background: #0a0a0f; color: #eab308; opacity: 0; }
.stepn span { font-family: "AB Mono", monospace; font-size: 24px; letter-spacing: .2em; } .stepn b { font-size: 60px; line-height: 1; }
/* CTA */
.cta { text-align: center; padding-top: 10px; }
.wide .cta { text-align: left; }
.cta .a { font-size: 96px; letter-spacing: -0.04em; }
.cta .b { font-size: 210px; letter-spacing: -0.06em; line-height: 1; color: #eab308; text-shadow: 0 0 50px rgba(234,179,8,.6); }
.cfield { display: flex; align-items: center; gap: 22px; margin: 34px auto 0; width: 900px; max-width: 100%; height: 110px; border-radius: 55px; border: 3px solid #8b5cf6;
  background: rgba(17,17,23,.95); padding: 0 36px; box-shadow: 0 0 34px rgba(139,92,246,.5); opacity: 0; }
.cfield .pre { font-size: 32px; color: #8A8A8A; font-weight: 400; } .cfield .kw { font-family: "AB Mono", monospace; font-size: 56px; color: #eab308; letter-spacing: .1em; flex: 1; text-align: left; }
.cfield .snd { display: flex; color: #eab308; opacity: 0; }
.cta .sub { margin-top: 22px; font-size: 34px; font-weight: 400; opacity: 0; } .cta .sub b { color: #eab308; }
/* caption pill */
#cap { position: absolute; left: 0; top: 0; z-index: 9; height: 92px; border-radius: 22px; background: rgba(10,10,15,.92); border: 3px solid #8b5cf6;
  box-shadow: 0 0 26px rgba(139,92,246,.6), inset 0 0 18px rgba(139,92,246,.25); }
.cap { position: absolute; left: 0; top: 0; height: 86px; display: flex; align-items: center; justify-content: center; gap: 0 24px; font-family: "AB Mono", monospace;
  font-size: 42px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; opacity: 0; }
.wide .cap { font-size: 38px; }
.cw { display: inline-block; color: #EDEDED; }
#flash { position: absolute; inset: 0; z-index: 30; opacity: 0; background: #fff3b0; pointer-events: none; }
.fb-sticker { z-index: 12; }
</style>
</head>
<body>
<div id="root" class="%%FORMAT%% %%CUTOUT%%" data-composition-id="autoboost-studio" data-start="0" data-width="%%W%%" data-height="%%H%%" data-duration="%%TOTAL%%" data-fps="30">
  <div class="bg"></div>
  <div class="grid"></div>
  <i class="tube l"></i><i class="tube r"></i>
  <div id="brand">%%BRAND%%</div>
%%LEVELS%%
%%SCENES%%
  %%CAM%%
  <div id="cap">%%CAPTIONS%%</div>
%%OVERLAYS%%
  <div id="flash"></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="kit/kit.js"></script>
  <script>
  (function () {
    var tl = gsap.timeline({ paused: true });
%%JS%%
    window.__timelines = window.__timelines || {};
    window.__timelines["autoboost-studio"] = tl;
  })();
  </script>
</div>
</body>
</html>
